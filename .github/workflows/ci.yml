
name: AI Inventory Agent CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  test:
    name: Test Django Application
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-test-only-not-a-real-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run automated tests
        run: python manage.py test


  build:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t ghcr.io/johnnyalhelou/aiagentinventory-ci-cd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/johnnyalhelou/aiagentinventory-ci-cd:latest

  verify-runner:
    name: Verify Mac Deployment Runner
    needs: build
    runs-on: [self-hosted, macOS, ARM64, inventory-deploy]

    steps:
      - name: Verify Docker on MacBook
        run: |
          docker --version
          docker info

  deploy:
    name: Deploy AI Inventory Agent
    needs: verify-runner
    runs-on: [self-hosted, macOS, ARM64, inventory-deploy]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker pull --platform linux/amd64 ghcr.io/johnnyalhelou/aiagentinventory-ci-cd:latest

      - name: Deploy Docker container
        run: |
          docker rm -f inventory-agent-deployed 2>/dev/null || true

          docker run -d \
            --platform linux/amd64 \
            --name inventory-agent-deployed \
            --restart unless-stopped \
            -p 127.0.0.1:8001:8000 \
            --env-file "$HOME/.config/inventory-agent/.env" \
            -e SQLITE_PATH=/app/data/db.sqlite3 \
            -v inventory-agent-data:/app/data \
            ghcr.io/johnnyalhelou/aiagentinventory-ci-cd:latest

      
      - name: Verify deployment
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8001/ > /dev/null; then
              echo "Deployment successful!"
              exit 0
            fi

            echo "Waiting for Django... Attempt $attempt/30"
            sleep 2
          done

          echo "Deployment failed: Django did not respond."
          docker logs --tail 30 inventory-agent-deployed
          exit 1

