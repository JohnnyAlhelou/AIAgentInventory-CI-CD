
name: AI Inventory Agent CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  test:
    name: Test Django Application
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-test-only-not-a-real-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run automated tests
        run: python manage.py test


  build:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t ghcr.io/johnnyalhelou/aiagentinventory-ci-cd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/johnnyalhelou/aiagentinventory-ci-cd:latest
